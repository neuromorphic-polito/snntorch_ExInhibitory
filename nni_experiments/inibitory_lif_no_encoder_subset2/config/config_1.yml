# Experiment: all the nni execution (all combinations)
# Trial: a single trial


experimentName: inibitory_lif_no_encoder_subset2

# Here is to 1, but it is changed in the GUI if running on a setup that allows it
trialConcurrency: 1

# For all combinations to be run
maxExperimentDuration: 72h


maxTrialNumber: 1000

# This is the hard limit
trainingService:
  platform: local
  useActiveGpu: True
  maxTrialNumberPerGpu: 4

# The space to explore
searchSpaceFile: ~/snntorch_network/nni_experiments/inibitory_lif_no_encoder_subset2/search_space/search_space1.json

useAnnotation: false

# The algorithm to use when exploring the search space
tuner:
    name: Anneal
    classArgs:
      optimize_mode: maximize


trialCodeDirectory: ~/snntorch_network/nni_experiments/inibitory_lif_no_encoder_subset2/code/
# The actual call to python
trialCommand: python3 experiment1.py --trial_path inibitory_lif_no_encoder_subset2
experimentWorkingDirectory: ~/snntorch_network/nni_experiments/inibitory_lif_no_encoder_subset2/results/

# 0 means no GPU. 1 is the id of the first GPU
trialGpuNumber: 1
